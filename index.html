function editor(){let g=groups[editorGroup],extras=db.questions.filter(q=>q.group===editorGroup);return title('Editor de formulários','Adicione perguntas e configure campos de demonstração. Estrutura base preservada.')+`<div class="grid2"><section class="panel"><h2>Seções do questionário</h2>${groups.map((x,i)=>`<button class="navbtn ${editorGroup===i?'active':''}" onclick="editorGroup=${i};render()">${x.icon} ${x.name} <span class="pill">${x.fields.length+db.questions.filter(q=>q.group===i).length}</span></button>`).join('')}</section><section class="panel"><h2>${g.name}</h2><p class="small muted">Campos padrão do protótipo e perguntas adicionais.</p>${g.fields.map(x=>`<div class="editorline"><span>☷</span><div><b class="small">${esc(x[1])}</b><div class="mini">${x[2]} • ${x[3]?'Obrigatório':'Opcional'} • Padrão</div></div><span class="pill">Base</span></div>`).join('')}${extras.map(q=>`<div class="editorline"><span>☷</span><div><b class="small">${esc(q.label)}</b><div class="mini">${q.type} • ${q.required?'Obrigatório':'Opcional'}</div></div><button class="btn red" onclick="removeQuestion('${q.key}')">Excluir</button></div>`).join('')}<h3 style="margin-top:20px">Adicionar campo</h3><div class="fields"><label class="field wide">Pergunta<input id="newlabel" placeholder="Ex.: Possui preferência de horário para visitas?"></label><label class="field">Tipo<select id="newtype"><option value="text">Texto curto</option><option value="textarea">Texto longo</option><option value="date">Data</option><option value="select">Sim / Não</option></select></label><label class="field">Obrigatoriedade<select id="newreq"><option value="0">Opcional</option><option value="1">Obrigatório</option></select></label></div><button class="btn" style="margin-top:15px" onclick="addQuestion()">+ Adicionar pergunta</button><p class="notice" style="margin-top:15px">Em produção, alterações serão publicadas por versão, com aprovação e preservação dos formulários já enviados. Os campos-base sensíveis não podem ser removidos livremente.</p></section></div>`}function addQuestion(){let label=$('#newlabel').value.trim();if(!label)return alert('Informe a pergunta.');db.questions.push({key:'custom_'+Date.now(),label,type:$('#newtype').value,required:+$('#newreq').value,group:editorGroup});log('Campo adicional criado: '+label);render()}function removeQuestion(key){db.questions=db.questions.filter(q=>q.key!==key);log('Campo adicional removido');render()}
function messages(){let f=family();return title('Central de comunicações','Mensagens de demonstração para WhatsApp e e-mail, sem envio real.')+`<div class="grid2"><section class="panel"><h2>Destinatário</h2><label class="field">Família<select id="msgfamily" onchange="db.selected=this.value;save();render()">${db.families.map(x=>`<option value="${x.id}" ${x.id===f.id?'selected':''}>${esc(x.name)} — ${esc(x.resident)}</option>`).join('')}</select></label><div class="profilebox" style="margin-top:14px"><b>${esc(f.name)}</b><p class="small">📱 ${esc(f.phone||'Sem WhatsApp')}<br>✉️ ${esc(f.email||'Sem e-mail')}</p></div><label class="field" style="margin-top:15px">Modelo de mensagem<select id="msgtype" onchange="previewMessage()"><option>Convite para preenchimento</option><option>Cadastro incompleto</option><option>Correção solicitada</option><option>Cadastro recebido</option><option>Agendamento de avaliação</option><option>Contrato pronto para revisão</option></select></label><label class="field" style="margin-top:13px">Mensagem<textarea id="msgtext">Olá, ${esc(f.name)}! A Divina Vó informa que há uma atualização no processo de pré-admissão de ${esc(f.resident)}. Acesse o portal seguro para consultar as orientações.</textarea></label><div class="toolbar" style="margin-top:14px"><button class="btn" onclick="queueMessage()">Registrar notificação simulada</button><button class="btn alt" onclick="navto('detail')">Abrir ficha</button></div></section><section class="panel"><h2>Histórico de notificações</h2>${(f.messages||[]).map(m=>`<div class="checkrow"><span>🔔</span><div><b>${esc(m.type)}</b><p class="small">${esc(m.text)}</p><div class="mini">${esc(m.when)}</div></div></div>`).join('')||'<div class="empty">Nenhuma notificação registrada.</div>'}<p class="notice">A integração futura usará provedores autorizados e links autenticados. Não incluiremos informações clínicas sensíveis no corpo das mensagens.</p></section></div>`}function previewMessage(){let f=family();$('#msgtext').value=`Olá, ${f.name}! A Divina Vó informa: ${$('#msgtype').value.toLowerCase()} no processo de ${f.resident}. Consulte os detalhes no portal seguro.`}function queueMessage(){let f=family();f.messages.unshift({type:$('#msgtype').value+' (simulação)',text:$('#msgtext').value,when:new Date().toLocaleString('pt-BR')});log('Notificação simulada: '+f.name);render()}
function contract(){let f=family();return title('Contratos e propostas','Prévia demonstrativa preenchida com os dados do cadastro.')+`<div class="grid2"><section class="panel"><h2>Selecionar atendimento</h2><label class="field">Residente<select onchange="db.selected=this.value;save();render()">${db.families.map(x=>`<option value="${x.id}" ${x.id===f.id?'selected':''}>${esc(x.resident)}</option>`).join('')}</select></label><p class="notice" style="margin-top:16px">Modelo contratual ilustrativo. O contrato verdadeiro deverá partir do documento fornecido pela Divina Vó e passar por revisão jurídica.</p><button class="btn alt" onclick="print()">Imprimir prévia</button></section><section class="panel" style="border-top:4px solid #39a6cf"><div style="text-align:center;padding:10px 0 18px"><b style="font-size:22px;color:#15749a">DIVINA VÓ</b><div class="small muted">Minuta demonstrativa • sem validade contratual</div></div><h2 style="text-align:center">Prestação de serviços de acolhimento</h2><p><b>Residente:</b> ${esc(f.answers.nome||f.resident)}</p><p><b>Responsável / contratante a validar:</b> ${esc(f.answers.responsavel||f.name)}</p><p><b>Contato:</b> ${esc(f.answers.telefone||f.phone)}</p><p><b>Plano comercial:</b> ${esc(f.plan||'A definir')}</p><p><b>Valor proposto:</b> ${f.value?'R$ '+Number(f.value).toLocaleString('pt-BR',{minimumFractionDigits:2}):'A definir'}</p><hr style="border:0;border-top:1px solid #e5edf3;margin:18px 0"><p class="small muted">Cláusulas, direitos, serviços, condições, anexos, vigência, reajustes e assinatura serão incorporados após aprovação do modelo real da instituição.</p><span class="pill gold">Rascunho</span></section></div>`}

function institutionOverview(){return `<section class="institution-banner"><div class="copy"><span class="pill green">GRUPO DIVINA VÓ</span><h2 style="margin-top:12px">Onde o cuidado encontra a excelência</h2><p>Um lar que cuida com alma e carinho. Gestão integrada para acolher cada residente e sua família.</p><div style="margin-top:15px"><span class="plan-chip">Residência Standard</span><span class="plan-chip">Residência Permanente</span><span class="plan-chip">Day Use</span></div></div><img src="https://divinavo.com.br/img/Onde-o-cuidado-encontra-a-excelencia.jpg" alt="Instalações da Divina Vó, fotografia do site institucional" onerror="this.style.display='none'"></section><div class="unit-grid"><div class="unit-tile"><strong>🌿 Recanto do Sabiá</strong><small>São Francisco • Rua Tamoios, 165 • Niterói</small></div><div class="unit-tile"><strong>🌷 Vivenda dos Colibris</strong><small>Maravista • Rua Dr. Pálvaro da Silva, 175 • Niterói</small></div><div class="unit-tile"><strong>🏡 Morada do João de Barro</strong><small>Pendotiba • Estrada Caetano Monteiro, 1894 • Niterói</small></div></div>`}
function render(){if(persona==='family'&&!['portal','form','messages'].includes(db.section))db.section='portal';if(persona!=='family'&&db.section==='portal')db.section='dashboard';nav();let pages={dashboard,admissions,detail,people,contact,users,form,portal,editor,messages,contract};$('#app').innerHTML=(pages[db.section]||dashboard)()}
$('#persona').onchange=e=>{persona=e.target.value;db.section=persona==='family'?'portal':'dashboard';save();render()};render();

// V2: fluxo integrado, com persistência local e acessos apenas demonstrativos.
const V2_ROLES=[{id:'admin',label:'Proprietário / Gestor',icon:'👑',detail:'Gestão do grupo, contratos, planos, aprovações e indicadores.'},{id:'analyst',label:'Equipe de Admissões',icon:'🗂️',detail:'Conferência cadastral, pendências, responsáveis e comunicações.'},{id:'health',label:'Equipe Assistencial',icon:'🩺',detail:'Avaliação, anamnese, validação clínica e resumo assistencial.'},{id:'family',label:'Responsável / Família',icon:'💜',detail:'Preenchimento, documentos, correções e acompanhamento.'}];
if(!db.v2)db.v2={};if(!db.v2.audit)db.v2.audit=[];if(!db.v2.unit)db.v2.unit='Grupo (todas as unidades)';if(!db.v2.activeRole)db.v2.activeRole='admin';
const v2stamp=()=>new Date().toLocaleString('pt-BR');
function v2log(message){db.v2.audit.unshift({when:v2stamp(),message});db.v2.audit=db.v2.audit.slice(0,150);save()}
function v2state(f){if(!f.v2)f.v2={unit:'Recanto do Sabiá',mode:'Residência Standard',status:'Rascunho',revision:1,contractApproved:false,clinicalApproved:false,contractModel:'Modelo demonstrativo',pending:[],documents:[],history:[]};return f.v2}
function v2audit(f,msg){v2state(f).history.unshift({when:v2stamp(),msg});v2log(f.resident+': '+msg)}
function v2canManage(){return persona!=='family'}
function v2canApproveClinical(){return persona==='health'}
function v2canApproveContract(){return persona==='admin'}
function v2roleName(){return V2_ROLES.find(r=>r.id===persona)?.label||'Perfil demonstrativo'}
function showDemoLogin(){let existing=document.querySelector('#v2auth');if(existing)existing.remove();let el=document.createElement('div');el.id='v2auth';el.className='auth-cover';el.innerHTML=`<div class="auth-box"><div class="row"><div><div class="small" style="color:#7b5391;font-weight:800">DIVINA VÓ 360° • V2</div><h1>Bem-vindo ao laboratório de admissão</h1><p class="muted">Escolha um perfil para testar as telas e as interações.</p></div><span class="pill gold">Acesso fictício • sem senha real</span></div><div class="role-grid">${V2_ROLES.map(r=>`<button class="role-tile ${r.id===db.v2.activeRole?'active':''}" onclick="v2choose('${r.id}')"><div class="roleicon">${r.icon}</div><b>${r.label}</b><small>${r.detail}</small></button>`).join('')}</div><div class="auth-controls"><label class="field">Família para teste<select id="v2family">${db.families.map(f=>`<option value="${esc(f.id)}" ${db.selected===f.id?'selected':''}>${esc(f.resident)} — ${esc(f.name)}</option>`).join('')}</select></label><button class="btn" onclick="v2enter()">Entrar no protótipo →</button><button class="btn alt" onclick="document.querySelector('#v2auth').remove()">Fechar</button></div><p class="notice" style="margin-top:16px">Não utilize dados reais. Perfis são apenas visualizações de demonstração: não existe autenticação, segregação de dados ou segurança de produção.</p></div>`;document.body.append(el)}
function v2choose(role){db.v2.activeRole=role;save();showDemoLogin()}
function v2enter(){persona=db.v2.activeRole;let sel=document.querySelector('#v2family');if(sel)db.selected=sel.value;let personaSelect=document.querySelector('#persona');if(personaSelect){if(persona==='health'&&!personaSelect.querySelector('[value="health"]'))personaSelect.add(new Option('🩺 Equipe assistencial','health'));personaSelect.value=persona}db.section=persona==='family'?'portal':'dashboard';save();document.querySelector('#v2auth')?.remove();render()}
function v2kanban(){let bands=[{name:'Interesse / Convite',ids:[0,1],icon:'📨'},{name:'Questionários',ids:[2,3,4],icon:'📝'},{name:'Avaliação',ids:[5],icon:'🩺'},{name:'Proposta / Contrato',ids:[6,7,8],icon:'📄'},{name:'Admissão concluída',ids:[9],icon:'✅'}];return `<div class="kanban">${bands.map(b=>`<div class="kanban-col"><b>${b.icon} ${b.name} (${db.families.filter(f=>b.ids.includes(f.stage)).length})</b>${db.families.filter(f=>b.ids.includes(f.stage)).map(f=>`<div class="kanban-card"><b>${esc(f.resident)}</b><div class="mini">Resp.: ${esc(f.name)}</div><div style="margin-top:8px">${pill(f.stage)}</div><div class="progress"><div style="width:${Math.max(0,Math.min(100,f.progress))}%"></div></div><button class="btn alt" onclick="selectFamily('${f.id}')">Abrir atendimento</button></div>`).join('')||'<div class="mini" style="margin-top:18px">Nenhum atendimento nesta etapa</div>'}</div>`).join('')}</div>`}
const v2OriginalDashboard=dashboard;
dashboard=function(){return `<div class="hero-v2"><div class="row"><div><h2>💜 Divina Vó 360° — Jornada de Admissão</h2><p class="muted" style="margin:0">${esc(v2roleName())} • ${esc(db.v2.unit)}</p></div><div class="toolbar"><button class="btn alt" onclick="showDemoLogin()">Testar outro perfil</button><button class="btn" onclick="navto('admissions')">Abrir admissões</button></div></div></div>`+v2OriginalDashboard()+`<section class="panel" style="margin-top:17px"><div class="row"><h2>🧩 Ciclo completo de admissão</h2><span class="pill blue">Interativo</span></div>${v2kanban()}</section><section class="panel" style="margin-top:17px"><h2>Documentos e etapas de revisão</h2><div class="action-grid"><div class="action-card"><b>📝 Formulários</b><p class="small">Família preenche, equipe confere e solicita correções.</p><button class="btn alt" onclick="navto('form')">Abrir</button></div><div class="action-card"><b>📄 Minuta contratual</b><p class="small">Plano, valores, campos variáveis e aprovação gerencial.</p><button class="btn alt" onclick="navto('contract')">Abrir</button></div><div class="action-card"><b>📂 Dossiê e documentos</b><p class="small">Prévia, impressão e histórico do atendimento.</p><button class="btn alt" onclick="navto('documents')">Abrir</button></div></div></section>`};
const v2OriginalAdmissions=admissions;
admissions=function(){return title('Central de admissões','Visão Kanban do ciclo completo e acompanhamento individual.')+`<section class="panel"><div class="row"><h2>Jornada dos residentes</h2><button class="btn" onclick="newAdmission()">+ Nova admissão</button></div>${v2kanban()}</section><div style="margin-top:18px">${v2OriginalAdmissions()}</div>`};
const v2OriginalDetail=detail;
detail=function(){let f=family(),s=v2state(f);return v2OriginalDetail()+`<section class="panel" style="margin-top:17px"><div class="row"><h2>🧩 Fluxo integrado e documentos</h2><span class="pill blue">${esc(s.unit)}</span></div><div class="fields"><label class="field">Unidade<select id="v2unit" onchange="v2set('unit',this.value)">${['Recanto do Sabiá','Vivenda dos Colibris','Morada do João de Barro'].map(u=>`<option ${s.unit===u?'selected':''}>${u}</option>`).join('')}</select></label><label class="field">Modalidade<select id="v2mode" onchange="v2set('mode',this.value)">${['Residência Standard','Residência Permanente','Day Use'].map(m=>`<option ${s.mode===m?'selected':''}>${m}</option>`).join('')}</select></label></div><div class="action-grid" style="margin-top:16px"><div class="action-card"><b>1. Cadastro e anamnese</b><p class="small">${f.progress}% preenchido • ${s.pending.length} apontamento(s)</p><button class="btn alt" onclick="navto('form')">Ver respostas</button></div><div class="action-card"><b>2. Avaliação assistencial</b><p class="small">${s.clinicalApproved?'Validada':'Aguardando validação profissional'}</p><button class="btn alt" onclick="navto('clinical')">Abrir avaliação</button></div><div class="action-card"><b>3. Contrato e dossiê</b><p class="small">${s.contractApproved?'Minuta aprovada':'Minuta pendente de revisão'}</p><button class="btn alt" onclick="navto('documents')">Abrir documentos</button></div></div><h3 style="margin-top:20px">Histórico deste atendimento</h3>${s.history.map(h=>`<div class="audit-row"><span class="mini">${esc(h.when)}</span> — ${esc(h.msg)}</div>`).join('')||'<p class="muted small">Nenhuma atividade adicional registrada nesta versão.</p>'}</section>`};
function v2set(key,val){if(!v2canManage())return alert('Somente equipe interna pode alterar esta informação.');let f=family();v2state(f)[key]=val;v2audit(f,'Alterado '+key+' para '+val);render()}
function v2addPending(){if(!v2canManage())return;let f=family(),field=document.querySelector('#v2pendingfield').value.trim(),msg=document.querySelector('#v2pendingnote').value.trim();if(!field||!msg)return alert('Informe o campo e a orientação.');v2state(f).pending.unshift({id:'P'+Date.now(),field,msg,status:'Aberto',when:v2stamp()});f.stage=4;v2audit(f,'Correção solicitada: '+field);render()}
function v2resolve(id){if(persona!=='family')return alert('A correção é respondida pelo perfil da família.');let f=family(),p=v2state(f).pending.find(x=>x.id===id);if(p){p.status='Respondido — aguardando conferência';v2audit(f,'Família respondeu ao apontamento: '+p.field);render()}}
function v2validate(id){if(!v2canManage())return;let f=family(),p=v2state(f).pending.find(x=>x.id===id);if(p){p.status='Validado';v2audit(f,'Equipe validou correção: '+p.field);render()}}
function pendingPanel(){let f=family(),s=v2state(f);return `<section class="panel" style="margin-top:18px"><h2>🔔 Apontamentos e correções</h2>${s.pending.map(p=>`<div class="checkrow"><div style="flex:1"><b>${esc(p.field)}</b><p class="small">${esc(p.msg)}</p><span class="pill ${p.status==='Validado'?'green':'gold'}">${esc(p.status)}</span></div>${persona==='family'&&p.status==='Aberto'?`<button class="btn" onclick="v2resolve('${p.id}')">Marcar como corrigido</button>`:persona!=='family'&&p.status.startsWith('Respondido')?`<button class="btn" onclick="v2validate('${p.id}')">Validar</button>`:''}</div>`).join('')||'<p class="muted small">Nenhum apontamento pendente.</p>'}${v2canManage()?`<div class="fields" style="margin-top:14px"><label class="field">Campo ou documento<input id="v2pendingfield" placeholder="Ex.: Prescrição atual"></label><label class="field">O que precisa corrigir?<input id="v2pendingnote" placeholder="Descreva o ajuste solicitado"></label></div><button class="btn" style="margin-top:12px" onclick="v2addPending()">Solicitar correção</button>`:''}<p class="mini">Notificações ficam no histórico local; WhatsApp/e-mail ainda não são enviados.</p></section>`}
const v2OriginalPortal=portal;
portal=function(){return v2OriginalPortal()+pendingPanel()+`<section class="panel" style="margin-top:15px"><h2>📂 Documentos disponíveis</h2><p class="small muted">Acompanhe os documentos de admissão e os apontamentos recebidos.</p><button class="btn alt" onclick="navto('documents')">Visualizar dossiê</button></section>`};
const v2OriginalForm=form;
form=function(){return v2OriginalForm()+pendingPanel()};
function clinical(){let f=family(),s=v2state(f);return title('Avaliação assistencial','Conferência de informações declaradas e registro da equipe habilitada.')+`<div class="grid2"><section class="panel"><h2>Informações declaradas pela família</h2><p class="small muted">Dados relatados não são diagnósticos ou prescrições validados.</p>${Object.entries(f.answers).map(([k,v])=>`<div class="doc-line"><b>${esc(k.replaceAll('_',' '))}:</b> ${esc(v)}</div>`).join('')||'<p class="notice">Ainda não há respostas cadastradas.</p>'}</section><section class="panel"><h2>Parecer assistencial inicial</h2><p class="notice">Somente profissionais habilitados devem validar a avaliação e registrar orientações clínicas. Demonstração sem valor de prontuário.</p><label class="field">Observações de avaliação<textarea id="v2clinicalnote">${esc(s.clinicalNote||'')}</textarea></label><label class="field" style="margin-top:12px">Encaminhamentos<textarea id="v2clinicalnext">${esc(s.clinicalNext||'')}</textarea></label><div class="toolbar" style="margin-top:14px"><button class="btn alt" onclick="v2saveClinical()" ${persona==='family'?'disabled':''}>Salvar rascunho</button><button class="btn" onclick="v2approveClinical()" ${!v2canApproveClinical()?'disabled':''}>Validar avaliação</button></div><p class="mini">Status: ${s.clinicalApproved?'Validada pela equipe (simulação)':'Aguardando validação'}</p></section></div>`}
function v2saveClinical(){if(persona==='family')return;let f=family(),s=v2state(f);s.clinicalNote=document.querySelector('#v2clinicalnote').value;s.clinicalNext=document.querySelector('#v2clinicalnext').value;s.clinicalApproved=false;v2audit(f,'Parecer assistencial salvo como rascunho');render()}
function v2approveClinical(){if(!v2canApproveClinical())return alert('Use o perfil Equipe Assistencial.');let f=family(),s=v2state(f);s.clinicalNote=document.querySelector('#v2clinicalnote').value;s.clinicalNext=document.querySelector('#v2clinicalnext').value;if(!s.clinicalNote.trim())return alert('Registre a avaliação antes de validar.');s.clinicalApproved=true;f.stage=Math.max(f.stage,5);v2audit(f,'Avaliação assistencial validada no laboratório');render()}
const v2OriginalContract=contract;
contract=function(){let f=family(),s=v2state(f);return v2OriginalContract()+`<section class="panel" style="margin-top:18px"><h2>Revisão e aprovação da minuta</h2><div class="fields"><label class="field">Unidade<input value="${esc(s.unit)}" disabled></label><label class="field">Modalidade<input value="${esc(s.mode)}" disabled></label><label class="field wide">Observações da revisão<textarea id="v2contractnote">${esc(s.contractNote||'')}</textarea></label></div><div class="toolbar" style="margin-top:14px"><button class="btn alt" onclick="v2saveContract()" ${!v2canManage()?'disabled':''}>Salvar revisão</button><button class="btn" onclick="v2approveContract()" ${!v2canApproveContract()?'disabled':''}>Aprovar minuta (simulação)</button><button class="btn alt" onclick="navto('documents')">Ver documentos</button></div><p class="notice" style="margin-top:13px">O modelo real do contrato e suas cláusulas devem ser fornecidos pela instituição e revisados juridicamente. Aprovação aqui é apenas simulada.</p></section>`};
function v2saveContract(){if(!v2canManage())return;let f=family(),s=v2state(f);s.contractNote=document.querySelector('#v2contractnote').value;s.contractApproved=false;s.revision++;v2audit(f,'Minuta salva para revisão V'+s.revision);render()}
function v2approveContract(){if(!v2canApproveContract())return alert('Use o perfil Proprietário / Gestor.');let f=family(),s=v2state(f);if(!s.clinicalApproved)return alert('A avaliação assistencial precisa ser validada antes da aprovação da minuta.');if(s.pending.some(p=>p.status!=='Validado'))return alert('Há correções ainda não validadas.');s.contractNote=document.querySelector('#v2contractnote').value;s.contractApproved=true;f.stage=Math.max(f.stage,7);v2audit(f,'Minuta demonstrativa aprovada para revisão jurídica');render()}

editor=function(){let g=groups[editorGroup],v=v3CustomFields(),base=g.fields.filter(x=>!v.hidden.includes(x[0])),extras=db.questions.filter(q=>q.group===editorGroup);return title('Editor de formulários','Configure tipos, obrigatoriedade, listas de opções e campos adicionais.')+v3Guide('Formulários personalizáveis','Você pode ocultar campos-base nesta demonstração e excluir campos personalizados. Campos críticos exigirão governança e versionamento na produção.')+`<div class="grid2"><section class="panel"><h2>Seções do questionário</h2>${groups.map((x,i)=>`<button class="navbtn ${editorGroup===i?'active':''}" onclick="editorGroup=${i};render()">${x.icon} ${x.name}</button>`).join('')}<p class="notice">A edição nesta versão altera apenas o laboratório local. Formulários anteriores não devem ser reescritos na produção.</p></section><section class="panel"><h2>${g.name}</h2><p class="small muted">Clique em Configurar para editar o tipo, obrigatoriedade e opções.</p>${[...base.map(x=>({key:x[0],label:x[1],type:x[2],required:x[3],base:true})),...extras.map(x=>({...x,base:false}))].map(q=>{let m=v3FieldMeta(q.key,q.type,q.required);return `<div class="editorline"><div><b class="small">${esc(q.label)}</b><div class="mini">${esc(m.type)} • ${m.required?'Obrigatório':'Opcional'} ${q.base?'• Campo-base':''}</div></div><button class="btn alt" onclick="v3EditField('${esc(q.key)}')">Configurar</button><button class="btn red" onclick="v3RemoveField('${esc(q.key)}',${q.base})">${q.base?'Ocultar':'Excluir'}</button></div>`}).join('')}<h3>Adicionar pergunta</h3><div class="fields"><label class="field wide">Pergunta<input id="newlabel" placeholder="Ex.: Data da última consulta"></label><label class="field">Tipo<select id="newtype" onchange="v3ToggleOptions()"><option value="text">Texto curto</option><option value="textarea">Texto longo</option><option value="date">Data</option><option value="number">Número</option><option value="select">Lista suspensa (dropdown)</option></select></label><label class="field">Obrigatoriedade<select id="newreq"><option value="0">Opcional</option><option value="1">Obrigatório</option></select></label><label class="field wide" id="v3optionslabel" style="display:none">Opções do dropdown (uma por linha)<textarea id="v3options" placeholder="Sim&#10;Não&#10;Não sei informar"></textarea></label></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="v3AddField()">+ Adicionar campo</button><button class="btn alt" onclick="v3RestoreFields()">Restaurar campos ocultos</button></div></section></div>`};
function v3ToggleOptions(){let el=document.querySelector('#v3optionslabel');if(el)el.style.display=document.querySelector('#newtype').value==='select'?'flex':'none'}
function v3AddField(){let label=document.querySelector('#newlabel').value.trim(),type=document.querySelector('#newtype').value;if(!label)return alert('Informe a pergunta.');let options=document.querySelector('#v3options').value.split('\n').map(x=>x.trim()).filter(Boolean);if(type==='select'&&options.length<2)return alert('Cadastre ao menos duas opções para o dropdown.');db.questions.push({key:'custom_'+Date.now(),label,type,required:document.querySelector('#newreq').value==='1',group:editorGroup,options:options.join('|')});log('Campo criado: '+label);render()}
function v3RemoveField(key,base){if(!confirm(base?'Ocultar este campo-base no formulário demonstrativo?':'Excluir este campo personalizado?'))return;let v=v3CustomFields();if(base){if(!v.hidden.includes(key))v.hidden.push(key)}else db.questions=db.questions.filter(q=>q.key!==key);log('Campo configurado: '+key);render()}

function v3EditField(key){let q=groups.flatMap(g=>g.fields).find(x=>x[0]===key),extra=db.questions.find(x=>x.key===key),current=q?{key,label:q[1],type:q[2],required:q[3]}:extra;if(!current)return;let m=v3FieldMeta(key,current.type,current.required);let type=prompt('Tipo: text, textarea, date, number ou select',m.type);if(type===null)return;if(!['text','textarea','date','number','select'].includes(type))return alert('Tipo inválido.');let options=m.options;if(type==='select'){let opt=prompt('Opções do dropdown separadas por | (barra vertical)',m.options);if(opt===null)return;if(opt.split('|').filter(x=>x.trim()).length<2)return alert('Informe ao menos duas opções.');options=opt}let req=confirm('Deseja que o campo seja obrigatório?');v3CustomFields().overrides[key]={type,required:req,options};log('Configuração atualizada: '+current.label);render()}
const v3OldGoFormGroup=goFormGroup;
form=function(){let f=family(),g=groups[db.formSection]||groups[0],v=v3CustomFields(),extras=db.questions.filter(q=>q.group===db.formSection);let original=g.fields,visible=original.filter(x=>!v.hidden.includes(x[0])),all=[...visible,...extras.map(q=>[q.key,q.label,q.type,q.required])];let complete=all.filter(([key])=>String(f.answers[key]||'').trim()).length;let steps=`<div class="stepbar">${groups.map((x,i)=>`<button class="${db.formSection===i?'active':''}" onclick="goFormGroup(${i})">${x.icon} ${x.name}</button>`).join('')}</div>`;let questions=all.map(([key,label,type,required])=>{let m=v3FieldMeta(key,type,required),saved=f.answers[key]||'',choices=extras.find(q=>q.key===key)?.options||m.options;let control=m.type==='textarea'?`<textarea id="q_${esc(key)}">${esc(saved)}</textarea>`:m.type==='select'?`<select id="q_${esc(key)}"><option value="">Selecione...</option>${choices.split('|').map(opt=>`<option value="${esc(opt.trim())}" ${saved===opt.trim()?'selected':''}>${esc(opt.trim())}</option>`).join('')}</select>`:`<input id="q_${esc(key)}" type="${m.type==='date'?'date':m.type==='number'?'number':'text'}" value="${esc(saved)}">`;return `<div class="question"><label for="q_${esc(key)}">${esc(label)} ${m.required?'<span class="req">*</span>':''}</label>${control}</div>`}).join('');return title('Formulário de pré-admissão',`${esc(f.resident)} • Dados vinculados ao atendimento selecionado`)+v3Guide('Etapa do responsável','Preencha e salve cada seção. Campos com * são obrigatórios. A equipe poderá solicitar ajustes pontuais.')+`<div class="panel"><div class="row"><h2>${esc(f.resident)}</h2><span class="pill blue">Seção ${db.formSection+1} de ${groups.length}</span></div>${steps}<div class="row"><h2>${g.icon} ${g.name}</h2><span class="small muted">${complete}/${all.length} campos</span></div><div class="progress" style="margin-bottom:12px"><div style="width:${Math.round(complete/Math.max(1,all.length)*100)}%"></div></div>${questions}<div class="toolbar" style="margi async function v4ReadFile(input){let f=input.files[0],status=document.querySelector('#v4fileStatus'),preview=document.querySelector('#v4filePreview');if(!f)return;if(f.size>8*1024*1024){status.textContent='Arquivo acima de 8 MB. Escolha um arquivo menor.';return}status.textContent=`Arquivo selecionado: ${f.name} (${Math.ceil(f.size/1024)} KB).`;preview.innerHTML='';if(f.type.startsWith('image/')){let url=URL.createObjectURL(f);preview.innerHTML=`<p class="notice">Foto carregada para consulta visual. A leitura automática (OCR) será integrada no backend futuro; transcreva as perguntas abaixo para criar o modelo.</p><img src="${url}" alt="Prévia do formulário enviado" style="max-width:100%;max-height:320px;object-fit:contain;border-radius:12px">`;return}if(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf')){status.textContent+=' Tentando extrair texto do PDF...';try{if(!window.pdfjsLib){await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let lines=[];for(let i=1;i<=Math.min(doc.numPages,10);i++){let p=await doc.getPage(i),c=await p.getTextContent();let ys=new Map();for(let item of c.items){let y=Math.round(item.transform[5]/5)*5;ys.set(y,(ys.get(y)||'')+' '+item.str)}lines.push(...[...ys.entries()].sort((a,b)=>b[0]-a[0]).map(x=>x[1].trim()).filter(Boolean))}document.querySelector('#v4importText').value=lines.join('\n');status.textContent=`PDF lido: ${doc.numPages} página(s). Confira as perguntas antes de importar.`}catch(e){status.textContent='Não foi possível extrair texto automaticamente. Verifique a internet ou transcreva as perguntas do PDF abaixo.'}}}

const V7_REFERENCE='https://dom.maua.sp.gov.br/public/docs/c4475a4d-0893-453c-9c26-c86f18e25eb7.pdf';
const V7_CLAUSES=`1. QUALIFICAÇÃO DAS PARTES\nA CONTRATADA é a instituição identificada neste documento, sujeita à confirmação de sua razão social, CNPJ, endereço e responsável legal. O CONTRATANTE e o RESIDENTE são qualificados com base nos dados conferidos pela equipe.\n\n2. OBJETO\nPrestação de serviços de acolhimento e cuidados previstos na modalidade escolhida, observadas a capacidade de atendimento, a avaliação assistencial e as regras aplicáveis à instituição.\n\n3. UNIDADE, MODALIDADE E INÍCIO\nO atendimento será realizado na unidade e modalidade indicadas no quadro de condições particulares. A data de início depende de confirmação formal.\n\n4. SERVIÇOS INCLUÍDOS\nAs atividades e os serviços incluídos serão descritos em anexo comercial aprovado, sem presumir procedimentos de saúde não contratados ou não autorizados.\n\n5. SERVIÇOS EXTRAS\nDespesas adicionais e serviços não incluídos exigem discriminação, critérios de cobrança e autorização conforme o instrumento definitivo.\n\n6. PREÇO E PAGAMENTO\nA mensalidade, vencimento, forma de pagamento, eventuais taxas e condições de reajuste deverão ser confirmados no quadro comercial e na versão jurídica aprovada.\n\n7. OBRIGAÇÕES DA INSTITUIÇÃO\nA instituição deverá observar as obrigações legais, sanitárias, assistenciais e contratuais aplicáveis, com comunicação adequada ao responsável e respeito à dignidade da pessoa idosa.\n\n8. DIREITOS DO RESIDENTE E RESPONSABILIDADES DO CONTRATANTE\nDevem ser assegurados os direitos do residente, a participação nas decisões cabíveis e a definição correta dos responsáveis, sem presumir representação legal pelo parentesco.\n\n9. SAÚDE, MEDICAMENTOS E EMERGÊNCIAS\nAs rotinas de medicação e situações de urgência dependem de protocolos, documentação e avaliação de profissionais habilitados. Dados clínicos detalhados permanecem em documentos assistenciais separados.\n\n10. DOCUMENTOS, PRIVACIDADE E COMUNICAÇÕES\nA coleta e o tratamento de dados pessoais e sensíveis devem respeitar a LGPD e a política institucional, com acesso limitado conforme a finalidade.\n\n11. VIGÊNCIA, ALTERAÇÕES E ENCERRAMENTO\nPrazos, aviso prévio, rescisão, condições de transferência e alterações devem ser definidos no modelo definitivo após revisão jurídica.\n\n12. DISPOSIÇÕES FINAIS E ASSINATURAS\nEsta minuta não constitui contrato celebrado. A contratação depende de revisão, aprovação e assinatura pelas partes devidamente qualificadas.`;

function v9Progress(f){let hidden=v3CustomFields().hidden;let keys=groups.flatMap(g=>g.fields.filter(x=>!hidden.includes(x[0])).map(x=>x[0])).concat(db.questions.map(x=>x.key));let done=keys.filter(k=>{let a=f.answers[k];return a!==undefined&&a!==null&&String(a).trim()!==''}).length;return Math.round(done/Math.max(1,keys.length)*100)}

function v9ConditionalControl(key,value){let yes=String(value||'').trim();return `<div class="v9-choices">${['Sim','Não','Não sei informar'].map(x=>`<label class="v9-choice"><input type="radio" name="v9radio_${key}" value="${x}" ${yes.startsWith(x)?'checked':''} onchange="v9ToggleConditional('${key}')">${x}</label>`).join('')}</div><div id="v9conditional_${key}" class="v9-follow" style="display:${yes.startsWith('Sim')?'block':'none'}"><label class="field">${key==='dispositivos'?'Quais dispositivos ou próteses utiliza?':'Descreva a dificuldade e os cuidados informados'}<textarea id="v9detail_${key}" rows="3" placeholder="Informe os detalhes">${esc(yes.startsWith('Sim')?yes.replace(/^Sim\s*[-:]?\s*/,''):'')}</textarea></label></div>`}

function v9Save(){let f=family(),g=groups[db.formSection],v=v3CustomFields(),fields=[...g.fields.filter(x=>!v.hidden.includes(x[0])),...db.questions.filter(x=>x.group===db.formSection).map(x=>[x.key,x.label,x.type,x.required])];for(let [key,label,type,req] of fields){let val=v9Answer(key);if(val===null)continue;let meta=v3FieldMeta(key,type,req);if(val&&meta.type==='cpf'&&!v4ValidCpf(val)){alert('Confira o CPF: '+label);return false}if(val&&meta.type==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)){alert('Confira o e-mail: '+label);return false}f.answers[key]=val}if(db.formSection===5){let a=v9DocState();a.selected=[...document.querySelectorAll('[data-v9doc]:checked')].map(x=>x.value);a.other=document.getElementById('v9docOther')?.value||''}v9Recalc(f);try{save()}catch(e){alert('Não foi possível salvar. O armazenamento local pode estar cheio.');return false}return true}

<script>
/* V19: notificações de demonstração persistidas no navegador, sem push remoto. */
function v19Alerts(){if(!Array.isArray(db.v19alerts))db.v19alerts=[];return db.v19alerts}
function v19Add(to,kind,f,message){if(!f)return;v19Alerts().unshift({id:'N'+Date.now()+Math.random().toString(36).slice(2,7),to,kind,fid:f.id,resident:f.resident,message,at:new Date().toLocaleString('pt-BR'),read:false});if(db.v19alerts.length>120)db.v19alerts.length=120;try{save()}catch(e){console.warn('Aviso não persistido',e)}}
function v19Relevant(){return v19Alerts().filter(a=>persona==='family'?a.to==='family'&&a.fid===family()?.id:a.to==='team')}
function v19Unread(){return v19Relevant().filter(a=>!a.read)}
function v19Open(){const panel=document.getElementById('v19-pop');if(!panel)return;panel.hidden=!panel.hidden;if(!panel.hidden){v19Relevant().forEach(a=>a.read=true);save();const badge=document.querySelector(".v19-count");if(badge)badge.remove()}}
function v19Go(id){let a=v19Alerts().find(x=>x.id===id);if(!a)return; a.read=true;save();document.getElementById('v19-pop')?.setAttribute('hidden','');if(persona==='family'){db.section='portal';save();render()}else selectFamily(a.fid,'detail')}
function v19PaintBell(){
 let top=document.querySelector('.top .toolbar');if(!top)return;
 let host=document.getElementById('v19-host');if(!host){host=document.createElement('div');host.id='v19-host';host.className='v19-toolbar';top.insertBefore(host,top.firstChild)}
 let all=v19Relevant(),unread=all.filter(a=>!a.read).length;
 let items=all.length?all.slice(0,12).map(a=>'<div class="v19-item"><b>'+esc(a.resident)+'</b>'+(a.read?'':'<span class="v19-tag">Novo</span>')+'<p>'+esc(a.message)+' · '+esc(a.at)+'</p><button class="linkbtn" onclick="v19Go(\''+a.id+'\')">Abrir atendimento →</button></div>').join(''):'<p class="v19-empty">Nenhuma atualização por enquanto.</p>';
 host.innerHTML='<button class="v19-bell" onclick="v19Open()" aria-label="Notificações">🔔 '+(unread?'<span class="v19-count">'+unread+'</span>':'')+'</button><div id="v19-pop" class="v19-pop" hidden><b>'+(persona==='family'?'Avisos da Divina Vó':'Atualizações recebidas')+'</b>'+items+'</div>';
}
function v19TeamBadges(){
 if(persona==='family')return;let unread=v19Unread();if(!unread.length)return;
 document.querySelectorAll('#app button').forEach(btn=>{let code=btn.getAttribute('onclick')||'';let m=code.match(/selectFamily\(['"]([^'"]+)/);if(!m)return;let count=unread.filter(a=>a.fid===m[1]).length;if(count&&!btn.querySelector('.v19-badge'))btn.insertAdjacentHTML('beforeend',' <span class="v19-new v19-badge">'+count+' novo'+(count>1?'s':'')+'</span>')});
 if(db.section==='dashboard'||db.section==='admissions'){let box=document.querySelector('#app .cards')||document.querySelector('#app .grid2')||document.querySelector('#app .panel');if(box){let bar=document.createElement('div');bar.className='v19-inline';bar.innerHTML='🔔 <b>'+unread.length+' atualização'+(unread.length>1?'ões':'')+' recebida'+(unread.length>1?'s':'')+'</b> <button onclick="v19Open()">Ver avisos</button>';box.parentNode.insertBefore(bar,box)}}
}
const v19RenderOld=render;render=function(){v19RenderOld();v19PaintBell();v19TeamBadges()};
/* Disparos somente após ações que de fato modificam dados. */
const v19OldFamilySave=v9Save;v9Save=function(){let f=family(),before=JSON.stringify(f.answers||{});let ok=v19OldFamilySave();if(ok&&persona==='family'&&JSON.stringify(f.answers||{})!==before)v19Add('team','form',f,'A família atualizou informações do cadastro.');return ok};
const v19OldSubmit=submitFamily;submitFamily=function(){let f=family(),before=f.stage;v19OldSubmit();if(persona==='family'&&f.stage===3&&before!==3)v19Add('team','submission',f,'Cadastro enviado para análise pela família.')};
const v19OldUpdateStage=updateStage;updateStage=function(v){let f=family(),before=f.stage;v19OldUpdateStage(v);if(persona!=='family'&&before!==f.stage)v19Add('family','status',f,'A solicitação mudou para: '+(stages[f.stage]||'Em andamento')+'.')};
const v19OldRequestFix=requestFix;requestFix=function(){let f=family();v19OldRequestFix();if(persona!=='family')v19Add('family','correction',f,'A equipe solicitou complementação ou correção de informações.')};
const v19OldRelease=v10Release;v10Release=function(t){let f=family(),was=v10Shares(f)[t]?.released;v19OldRelease(t);if(!was&&v10Shares(f)[t]?.released)v19Add('family','document',f,'Um novo documento foi disponibilizado pela instituição.')};
const v19OldRevoke=v10Revoke;v10Revoke=function(t){let f=family(),was=v10Shares(f)[t]?.released;v19OldRevoke(t);if(was&&!v10Shares(f)[t]?.released)v19Add('family','document',f,'O acesso a um documento foi atualizado pela instituição.')};
const v19OldInvite=v3Invite;v3Invite=function(){let f=family(),was=v2state(f).invited;v19OldInvite();if(!was&&v2state(f).invited)v19Add('family','invitation',f,'Convite de pré-admissão registrado pela equipe (simulação).')};
const v19OldSaveNote=saveNote;saveNote=function(){let f=family(),before=f.notes;v19OldSaveNote();if(persona!=='family'&&before!==f.notes)v19Add('family','message',f,'A equipe registrou uma atualização no atendimento.')};
const v19OldUpload=v9Upload;v9Upload=async function(id,input){let f=family(),before=Object.keys(v9DocState().uploads||{}).length;await v19OldUpload(id,input);if(persona==='family'&&Object.keys(v9DocState().uploads||{}).length>before)v19Add('team','attachment',f,'Novo documento anexado pela família.')};
/* Mapa em destaque, antes dos cards do portal. */
portal=function(){const html=v18PreviousPortal();const map=v18Journey();const at=html.indexOf('<div class="grid2">');return at>=0?html.slice(0,at)+map+html.slice(at):map+html};
</script>
<style>
.v20-head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.v20-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:12px 0}.v20-stat{border:1px solid #e9e4ed;border-radius:10px;padding:12px;background:#fff}.v20-stat strong{display:block;font-size:20px;color:#684583}.v20-stat small{font-size:11px;color:#697985}.v20-row{padding:13px 0;border-bottom:1px solid #edf0f2}.v20-row:last-child{border:0}.v20-answer{background:#f8fafb;border:1px solid #e9edf0;padding:10px 12px;border-radius:9px;margin:7px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.v20-ops{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.v20-ops button{border:1px solid #dedce6;background:white;border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer;color:#58436d}.v20-ops button.active{background:#e7f4ed;border-color:#9bd4b5;color:#256c50}.v20-ops button.warn.active{background:#fff0eb;border-color:#f0b6a3;color:#a04835}.v20-ops button.clinical.active{background:#eaf2fc;border-color:#b8cee9;color:#315f8b}.v20-comment{margin-top:9px;display:grid;gap:7px}.v20-comment textarea{width:100%;min-height:60px}.v20-note{border:1px solid #e8dce9;background:#fcf9fd;padding:10px;border-radius:9px;margin:9px 0;font-size:12px}.v20-bubble{font-size:10px;color:#87538d;background:#f6eef8;border-radius:20px;padding:3px 7px}.v20-target{border-left:3px solid #b87aaf!important;background:#fdf8fd!important}.v20-list{display:grid;gap:8px}.v20-list button{text-align:left;border:1px solid #e6e3eb;background:#fff;padding:11px;border-radius:10px;cursor:pointer;color:#55436b}.v20-compact{font-size:11px;color:#70808c}.v20-section-tabs{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.v20-section-tabs button{font-size:11px;padding:8px;border-radius:9px;border:1px solid #e0dce6;background:#fff;color:#59436c}.v20-section-tabs button.active{background:#724b86;color:#fff}.v20-correction{border:1px solid #f0d6c7;background:#fff9f6;border-radius:10px;padding:12px;margin:10px 0}.v20-tag{font-size:10px;border-radius:12px;background:#f5eef8;color:#754d85;padding:4px 7px}.v20-row select{max-width:230px}@media(max-width:700px){.v20-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.v20-head{align-items:flex-start}}
</style><script>
/* V20 — revisão por campo, preservando o conteúdo declarado pela família. */
function v20State(f){if(!f.v20)f.v20={reviews:{},snapshot:{},history:[],section:0,assigned:'',phase:'Aguardando análise',round:0};return f.v20}
function v20Fields(i){let hidden=v3CustomFields().hidden;return groups[i].fields.filter(x=>!hidden.includes(x[0])).concat(db.questions.filter(x=>x.group===i).map(q=>[q.key,q.label,q.type,q.required]))}
function v20AllFields(){return groups.flatMap((g,i)=>v20Fields(i).map(x=>({key:x[0],label:x[1],group:i,required:!!x[3]})))}
function v20Stats(f){let s=v20State(f),items=v20AllFields().filter(x=>String(f.answers?.[x.key]||'').trim());let a=items.filter(x=>s.reviews[x.key]?.status==='approved').length,c=items.filter(x=>s.reviews[x.key]?.status==='correction').length,h=items.filter(x=>s.reviews[x.key]?.status==='clinical').length;return {total:items.length,approved:a,correction:c,clinical:h,pending:items.length-a-c-h}}
function v20History(f,action,key,detail){let s=v20State(f);s.history.unshift({at:new Date().toLocaleString('pt-BR'),by:persona,action,key,detail});if(s.history.length>250)s.history.length=250;save()}
function v20Open(id,group=0){if(persona==='family')return;db.selected=id;db.section='review';v20State(family()).section=group;save();render()}
function v20PickGroup(i){v20State(family()).section=i;save();render()}
function v20SetReview(key,status){if(persona==='family')return;let f=family(),s=v20State(f),answer=String(f.answers?.[key]||'');if(!answer.trim())return alert('Campo ainda não preenchido pela família.');let previous=s.reviews[key];if(status==='correction'||status==='clinical'){s.reviews[key]={status,note:previous?.note||'',answer,at:new Date().toLocaleString('pt-BR'),by:persona,sent:false};save();render();let el=document.getElementById('v20note_'+key);el?.focus();return} s.reviews[key]={status:'approved',note:'',answer,at:new Date().toLocaleString('pt-BR'),by:persona,sent:false};v20History(f,'Informação validada',key,answer);render()}
function v20SaveCritique(key){let f=family(),s=v20State(f),r=s.reviews[key];if(!r)return;let note=document.getElementById('v20note_'+key)?.value.trim()||'';if(!note)return alert('Descreva a crítica ou orientação para este campo.');r.note=note;r.sent=false;r.at=new Date().toLocaleString('pt-BR');v20History(f,r.status==='clinical'?'Encaminhamento assistencial registrado':'Crítica registrada',key,note);render()}
function v20ApproveSection(){if(persona==='family')return;let f=family(),s=v20State(f),i=s.section,keys=v20Fields(i).map(x=>x[0]).filter(k=>String(f.answers?.[k]||'').trim());let safe=keys.filter(k=>!['correction','clinical'].includes(s.reviews[k]?.status));if(!safe.length)return alert('Nenhuma resposta disponível para aprovação em lote.');if(!confirm('Validar '+safe.length+' respostas desta seção? Itens criticados ou assistenciais não serão alterados.'))return;safe.forEach(k=>s.reviews[k]={status:'approved',answer:String(f.answers[k]),note:'',at:new Date().toLocaleString('pt-BR'),by:persona,sent:false});v20History(f,'Seção validada',groups[i].name,safe.length+' campos');render()}
function v20SendCorrections(){if(persona==='family')return;let f=family(),s=v20State(f),items=Object.entries(s.reviews).filter(([k,r])=>r.status==='correction'&&r.note?.trim()&&!r.sent);let invalid=Object.entries(s.reviews).some(([k,r])=>r.status==='correction'&&!r.note?.trim());if(invalid)return alert('Preencha a justificativa de todas as críticas antes de enviá-las.');if(!items.length)return alert('Não há novas críticas para enviar.');items.forEach(([k,r])=>r.sent=true);s.phase='Aguardando correções da família';s.round++;f.stage=4;v20History(f,'Correções enviadas à família','',items.length+' itens');v19Add('family','review',f,'A equipe solicitou '+items.length+' esclarecimento(s). Abra as pendências para corrigir somente os campos indicados.');save();render()}
function v20Finish(){if(persona==='family')return;let f=family(),s=v20State(f),stats=v20Stats(f);if(stats.pending||stats.correction||stats.clinical)return alert('Ainda existem '+stats.pending+' campos sem análise, '+stats.correction+' críticas e '+stats.clinical+' encaminhamentos assistenciais. Resolva-os antes de concluir.');if(!stats.total)return alert('Não há informações preenchidas para validar.');s.phase='Conferência cadastral concluída';if(f.stage<5)f.stage=5;v20History(f,'Conferência cadastral concluída','','Aguardando avaliação profissional e decisões comerciais');v19Add('family','review',f,'A conferência cadastral foi concluída. A próxima etapa depende da avaliação da instituição.');save();render()}
function v20Queue(){return title('Central de Conferência','Respostas da família, críticas, devoluções e encaminhamentos com histórico.')+'<section class="panel"><div class="v20-head"><h2>Atendimentos para análise</h2><span class="v20-tag">Ambiente demonstrativo</span></div><div class="v20-list">'+db.families.map(f=>{let st=v20Stats(f),s=v20State(f);return '<button onclick="v20Open(\''+esc(f.id)+'\')"><b>'+esc(f.resident)+'</b> <span class="v20-tag">'+esc(s.phase)+'</span><div class="v20-compact">'+esc(f.name)+' · '+st.pending+' a conferir · '+st.correction+' críticas · '+st.clinical+' assistenciais · '+st.approved+' validados</div></button>'}).join('')+'</div></section>'}
function v20Review(){let f=family(),s=v20State(f),st=v20Stats(f),i=s.section;return title('Conferência do atendimento',esc(f.resident)+' • Responsável: '+esc(f.name))+'<section class="panel"><div class="v20-head"><div><h2>'+esc(f.resident)+'</h2><span class="v20-tag">'+esc(s.phase)+'</span></div><button class="btn alt" onclick="navto(\'reviewQueue\')">← Voltar à fila</button></div><div class="v20-stats">'+[['Validados',st.approved],['Correções',st.correction],['Assistenciais',st.clinical],['A conferir',st.pending]].map(([label,n])=>'<div class="v20-stat"><strong>'+n+'</strong><small>'+label+'</small></div>').join('')+'</div><div class="v20-head"><span class="v20-compact">'+st.total+' respostas preenchidas · '+esc(s.assigned||'Sem analista definido')+'</span><label class="field" style="max-width:220px">Analista responsável<select onchange="v20Assign(this.value)"><option value="">Selecionar analista</option>'+db.users.map(u=>'<option value="'+esc(u.name)+'" '+(s.assigned===u.name?'selected':'')+'>'+esc(u.name)+'</option>').join('')+'</select></label></div><div class="v20-section-tabs">'+groups.map((g,j)=>'<button class="'+(j===i?'active':'')+'" onclick="v20PickGroup('+j+')">'+g.icon+' '+esc(g.name)+'</button>').join('')+'</div><div class="v20-head"><h2>'+groups[i].icon+' '+esc(groups[i].name)+'</h2><button class="btn alt" onclick="v20ApproveSection()">✓ Validar seção sem críticas</button></div>'+v20Fields(i).map(([key,label,type,required])=>{let val=String(f.answers?.[key]||''),r=s.reviews[key],status=r?.status||'pending',changed=r&&r.answer!==val;return '<div class="v20-row" id="v20row_'+esc(key)+'"><div class="v20-head"><b>'+esc(label)+(required?' *':'')+'</b><span class="v20-tag">'+({approved:'Validado',correction:'Correção',clinical:'Assistencial',pending:'A conferir'}[status])+(changed?' · Resposta alterada':'')+'</span></div><div class="v20-answer">'+esc(val||'Não informado')+'</div>'+(val.trim()?'<div class="v20-ops"><button class="'+(status==='approved'?'active':'')+'" onclick="v20SetReview(\''+esc(key)+'\',\'approved\')">✓ Validar</button><button class="warn '+(status==='correction'?'active':'')+'" onclick="v20SetReview(\''+esc(key)+'\',\'correction\')">✎ Solicitar correção</button><button class="clinical '+(status==='clinical'?'active':'')+'" onclick="v20SetReview(\''+esc(key)+'\',\'clinical\')">🩺 Encaminhar</button></div>':'<span class="v20-compact">Aguardando preenchimento</span>')+(['correction','clinical'].includes(status)?'<div class="v20-comment"><label class="field">'+(status==='clinical'?'Orientação para a equipe assistencial':'O que a família precisa esclarecer?')+'<textarea id="v20note_'+esc(key)+'" placeholder="Descreva de forma objetiva">'+esc(r.note||'')+'</textarea></label><button class="btn alt" onclick="v20SaveCritique(\''+esc(key)+'\')">Salvar orientação</button>'+(r.sent?'<span class="v20-compact">Enviado à família</span>':'')+'</div>':'')+'</div>'}).join('')+'</section><section class="panel" style="margin-top:12px"><div class="toolbar"><button class="btn warn" onclick="v20SendCorrections()">Enviar correções à família</button><button class="btn" onclick="v20Finish()">Concluir conferência cadastral</button></div><h3>Histórico da conferência</h3>'+(s.history.slice(0,15).map(h=>'<div class="v20-row"><b>'+esc(h.action)+'</b> · '+esc(h.key)+'<div class="v20-compact">'+esc(h.at)+' · '+esc(h.by)+' · '+esc(h.detail)+'</div></div>').join('')||'<p class="muted small">Sem decisões registradas.</p>')+'</section>'}
function v20Assign(name){let f=family();v20State(f).assigned=name;v20History(f,'Analista definido','',name);render()}
function v20FamilyCorrections(){let f=family(),s=v20State(f),items=v20AllFields().filter(x=>s.reviews[x.key]?.status==='correction'&&s.reviews[x.key]?.sent);if(!items.length)return '';return '<section class="panel" style="margin-bottom:12px"><div class="v20-head"><h2>✎ Esclarecimentos solicitados</h2><span class="v20-tag">'+items.length+' pendência(s)</span></div><p class="small muted">Corrija somente as respostas indicadas e salve o formulário. A equipe será avisada.</p>'+items.map(x=>'<div class="v20-correction"><b>'+esc(x.label)+'</b><p class="small">'+esc(s.reviews[x.key].note)+'</p><button class="btn alt" onclick="v20GoCorrection('+x.group+',\''+esc(x.key)+'\')">Corrigir informação →</button></div>').join('')+'</section>'}
function v20GoCorrection(group,key){db.formSection=group;db.section='form';save();render();setTimeout(()=>{let el=document.getElementById('q_'+key)||document.querySelector('[data-v9check="'+key+'"]')||document.querySelector('[name="v9radio_'+key+'"]');if(el){let target=el.closest('.question')||el;target.classList.add('v20-target');target.scrollIntoView({behavior:'smooth',block:'center'});el.focus?.()}},70)}
function v20OnFamilySave(f,before){let s=v20State(f),changes=[];Object.keys(f.answers||{}).forEach(key=>{if(String(before[key]??'')===String(f.answers[key]??''))return;let r=s.reviews[key];if(r){if(r.status==='correction'&&r.sent){changes.push(key);v20History(f,'Resposta corrigida pela família',key,'Resposta anterior: '+String(before[key]||'Não informada'));}delete s.reviews[key]}});if(changes.length){s.phase='Correções recebidas — reanalisar';v19Add('team','review',f,changes.length+' resposta(s) corrigida(s) aguardando nova análise.')}save()}
const v20OldRender=render;render=function(){v20OldRender();if(persona!=='family'&&(db.section==='reviewQueue'||db.section==='review')){$('#app').innerHTML=db.section==='reviewQueue'?v20Queue():v20Review();v19TeamBadges()}}

const v20OldDetail=detail;detail=function(){let html=v20OldDetail();if(persona==='family')return html;let f=family();return '<div class="toolbar" style="margin-bottom:10px"><button class="btn" onclick="v20Open(\''+esc(f.id)+'\')">✓ Conferir respostas da família</button></div>'+html};

function v21Init(){if(!db.v21)db.v21={companies:[{id:'E1',legalName:'',tradeName:'Grupo Divina Vó',cnpj:'',stateReg:'',municipalReg:'',email:'',phone:'',website:'https://divinavo.com.br/',street:'',number:'',complement:'',district:'',city:'',state:'RJ',zip:'',legalNotes:'',reps:[]}],units:[{id:'U1',name:'Recanto do Sabiá',companyId:'E1',cnpj:'',street:'',number:'',complement:'',district:'',city:'Niterói',state:'RJ',zip:'',phone:'',email:''},{id:'U2',name:'Vivenda dos Colibris',companyId:'E1',cnpj:'',street:'',number:'',complement:'',district:'',city:'Niterói',state:'RJ',zip:'',phone:'',email:''},{id:'U3',name:'Morada do João de Barro',companyId:'E1',cnpj:'',street:'',number:'',complement:'',district:'',city:'Niterói',state:'RJ',zip:'',phone:'',email:''}],selectedCompany:'E1',selectedUnit:'U1',tab:'companies',history:[]};save()}

function v21UnitSet(k,v){v21Unit()[k]=v;save()}
function v21RepSet(i,k,v){v21Company().reps[i][k]=v;save()}
function v21AddCompany(){let c={id:'E'+Date.now(),reps:[],tradeName:'Nova pessoa jurídica'};db.v21.companies.push(c);db.v21.selectedCompany=c.id;save();render()}
function v21AddUnit(){let u={id:'U'+Date.now(),name:'Nova unidade',companyId:v21Company().id,cnpj:''};db.v21.units.push(u);db.v21.selectedUnit=u.id;save();render()}
function v21AddRep(){v21Company().reps.push({name:'',role:'',powers:''});save();render()}
function v21RemoveRep(i){if(!confirm('Excluir este representante do cadastro institucional?'))return;v21Company().reps.splice(i,1);save();render()}
function v21SelectCompany(id){db.v21.selectedCompany=id;save();render()}
function v21SelectUnit(id){db.v21.selectedUnit=id;save();render()}
function v21Tab(t){db.v21.tab=t;save();render()}
function v21Address(x){return [x.street,[x.number,x.complement].filter(Boolean).join(' / '),x.district,x.city,x.state,x.zip].filter(Boolean).join(', ')||'Endereço não cadastrado'}
function v21Snapshot(){return JSON.parse(JSON.stringify({companies:db.v21.companies,units:db.v21.units}))}
function v21SaveRegistry(){db.v21.history.unshift({at:new Date().toLocaleString('pt-BR'),by:persona,summary:`${db.v21.companies.length} pessoa(s) jurídica(s), ${db.v21.units.length} unidade(s)`,snapshot:v21Snapshot()});save();alert('Cadastro institucional salvo. Uma cópia de referência foi registrada no histórico.');render()}
function v21Registry(){v21Init();const t=db.v21.tab,c=v21Company(),u=v21Unit();return `<div class="v7-hero"><h1>🏛️ Cadastro Institucional</h1><p>Dados jurídicos e administrativos usados automaticamente nas minutas da Divina Vó. Preencha com os documentos oficiais da instituição.</p></div><div class="v7-tabbar">${[['companies','Pessoas jurídicas'],['units','Unidades'],['history','Histórico']].map(([id,n])=>`<button class="${t===id?'active':''}" onclick="v21Tab('${id}')">${n}</button>`).join('')}</div>${t==='companies'?`<section class="panel"><div class="row"><h2>Dados da pessoa jurídica</h2><button class="btn alt" onclick="v21AddCompany()">+ Nova pessoa jurídica</button></div><label class="v21-field">Selecionar empresa<select onchange="v21SelectCompany(this.value)">${db.v21.companies.map(x=>`<option value="${esc(x.id)}" ${x.id===c.id?'selected':''}>${esc(x.legalName||x.tradeName||x.id)}</option>`).join('')}</select></label><div class="v21-grid" style="margin-top:12px">${v21Fields.map(([k,l])=>v21FieldHtml(c,k,l,'v21CompanySet')).join('')}</div><h3>Representantes legais e signatários</h3><p class="small muted">Cadastre os representantes e confira a documentação de poderes antes da assinatura.</p>${c.reps.map((r,i)=>`<div class="v21-box"><div class="row"><b>Representante ${i+1}</b><button class="btn alt" onclick="v21RemoveRep(${i})">Excluir</button></div><div class="v21-grid">${v21RepFields.map(([k,l])=>`<label class="v21-field">${esc(l)}<input value="${esc(r[k]||'')}" oninput="v21RepSet(${i},'${k}',this.value)"></label>`).join('')}</div></div>`).join('')}<button class="btn alt" onclick="v21AddRep()">+ Adicionar representante</button></section>`:t==='units'?`<section class="panel"><div class="row"><h2>Unidades da instituição</h2><button class="btn alt" onclick="v21AddUnit()">+ Nova unidade</button></div><label class="v21-field">Selecionar unidade<select onchange="v21SelectUnit(this.value)">${db.v21.units.map(x=>`<option value="${esc(x.id)}" ${x.id===u.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="v21-grid" style="margin-top:12px"><label class="v21-field">Nome da unidade<input value="${esc(u.name||'')}" oninput="v21UnitSet('name',this.value)"></label><label class="v21-field">Pessoa jurídica responsável<select onchange="v21UnitSet('companyId',this.value)">${db.v21.companies.map(x=>`<option value="${esc(x.id)}" ${x.id===u.companyId?'selected':''}>${esc(x.legalName||x.tradeName||x.id)}</option>`).join('')}</select></label>${[['cnpj','CNPJ da unidade (opcional)'],['street','Logradouro'],['number','Número'],['complement','Complemento'],['district','Bairro'],['city','Cidade'],['state','UF'],['zip','CEP'],['phone','Telefone'],['email','E-mail']].map(([k,l])=>v21FieldHtml(u,k,l,'v21UnitSet')).join('')}</div><div class="v21-hint">A unidade selecionada determina a pessoa jurídica que constará como contratada. O CNPJ da unidade é opcional. Quando estiver vazio, a minuta utiliza o CNPJ da pessoa jurídica vinculada.</div></section>`:`<section class="panel"><h2>Registros de atualização</h2>${db.v21.history.length?db.v21.history.map(x=>`<div class="checkrow"><b>${esc(x.at)}</b><span class="small muted">${esc(x.summary)}</span></div>`).join(''):'<p class="muted">Nenhuma versão de cadastro registrada ainda.</p>'}</section>`}<section class="panel" style="margin-top:12px"><div class="row"><p class="small muted">Os dados são fictícios/incompletos até conferência documental. Não utilizar em contratos reais.</p><button class="btn" onclick="v21SaveRegistry()">Salvar cadastro institucional</button></div><button class="btn alt" onclick="navto('contract')">Abrir Central de Contratos</button></section>`}
const v21OldNav=nav;nav=function(){v21OldNav();if(persona==='family')return;let n=document.getElementById('nav');if(n)n.insertAdjacentHTML('beforeend',`<button class="navbtn ${db.section==='institution'?'active':''}" onclick="navto('institution')">🏛️ Cadastro Institucional</button>`)};

function v21UnitFor(data){v21Init();return db.v21.units.find(u=>u.name===data.unit)||null}
function v21Info(data){let u=v21UnitFor(data);let c=db.v21.companies.find(x=>x.id===u?.companyId)||null;return {u,c}}
function v21InstitutionHTML(data,override){const {u,c}=override||v21Info(data);let reps=c?.reps||[];return `<h3>QUALIFICAÇÃO DA CONTRATADA</h3><p><b>Razão social:</b> ${esc(c?.legalName||'A confirmar')}<br><b>Nome fantasia:</b> ${esc(c?.tradeName||'A confirmar')}<br><b>CNPJ:</b> ${esc(c?.cnpj||'A confirmar')}<br><b>Inscrição municipal:</b> ${esc(c?.municipalReg||'A confirmar')}<br><b>Endereço da pessoa jurídica:</b> ${esc(c?v21Address(c):'A confirmar')}<br><b>Telefone:</b> ${esc(c?.phone||'A confirmar')}<br><b>E-mail:</b> ${esc(c?.email||'A confirmar')}</p><h3>UNIDADE DE PRESTAÇÃO DOS SERVIÇOS</h3><p><b>Unidade:</b> ${esc(u?.name||data.unit||'A definir')}<br><b>CNPJ da unidade:</b> ${esc(u?.cnpj||c?.cnpj||'A confirmar')} ${u?.cnpj?'(próprio)':'(da pessoa jurídica vinculada)'}<br><b>Endereço:</b> ${esc(u?v21Address(u):'A confirmar')}<br><b>Contato:</b> ${esc(u?.phone||'A confirmar')}</p><h3>REPRESENTAÇÃO DA CONTRATADA</h3>${reps.length?reps.map(r=>`<p><b>${esc(r.name||'Nome a confirmar')}</b> — ${esc(r.role||'Cargo a confirmar')}<br>CPF: ${esc(r.cpf||'A confirmar')}<br>Qualificação: ${esc(r.qualification||'A confirmar')}<br>Poderes de representação: ${esc(r.powers||'A conferir')}</p>`).join(''):'<p>Representante legal ainda não cadastrado. Conferir antes da aprovação.</p>'}`}
const v21OldDoc=v7Doc;v7Doc=function(f=family(),data=v7Current(),model=v7Model(),stamp='PRÉ-CONTRATO • MINUTA DEMONSTRATIVA'){let h=v21OldDoc(f,data,model,stamp);const info=data.v21InstitutionSnapshot||v21Info(data);return h.replace('<h3>QUADRO DE CONDIÇÕES PARTICULARES</h3>',v21InstitutionHTML(data,info)+'<h3>QUADRO DE CONDIÇÕES PARTICULARES</h3>')};

const v21Vars=[['empresa_razao','Razão social da contratada'],['empresa_fantasia','Nome fantasia'],['empresa_cnpj','CNPJ da contratada'],['empresa_endereco','Endereço da contratada'],['empresa_email','E-mail da contratada'],['empresa_telefone','Telefone da contratada'],['unidade_cnpj','CNPJ da unidade (ou da pessoa jurídica vinculada)'],['unidade_endereco','Endereço da unidade'],['representante_nome','Nome do representante'],['representante_cpf','CPF do representante'],['representante_cargo','Cargo do representante']];
if(typeof v8Vars!=='undefined')v8Vars.push(...v21Vars);

function v21ReplaceVars(txt,data){const {u,c}=data.v21InstitutionSnapshot||v21Info(data);const r=c?.reps?.[0]||{};const map={empresa_razao:c?.legalName,empresa_fantasia:c?.tradeName,empresa_cnpj:c?.cnpj,empresa_endereco:c?v21Address(c):'',empresa_email:c?.email,empresa_telefone:c?.phone,unidade_cnpj:u?.cnpj||c?.cnpj,unidade_endereco:u?v21Address(u):'',representante_nome:r.name,representante_cpf:r.cpf,representante_cargo:r.role};return String(txt).replace(/\{\{(empresa_razao|empresa_fantasia|empresa_cnpj|empresa_endereco|empresa_email|empresa_telefone|unidade_cnpj|unidade_endereco|representante_nome|representante_cpf|representante_cargo)\}\}/g,(_,k)=>map[k]||'[A CONFIRMAR]')}
